name: PHPT Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  # sdl 2.7.0 on PECL does not build on PHP 8.5 and emits startup warnings
  # on PHP 8.x: build it from an upstream commit that fixes both.
  SDL_REF: 419eb9d759e8d56b106455c5a84d25fe67526c63

jobs:
  phpt-test:
    name: "PHPT Tests (PHP ${{ matrix.php-versions }})"
    strategy:
      fail-fast: false
      matrix:
#        os: [macos-latest, ubuntu-latest]
        os: [ubuntu-latest]
        php-versions: ['8.2', '8.3', '8.4', '8.5']
#        zts-mode: [zts, nts]
        zts-mode: [zts]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, intl
      - name: "Build SDL extension"
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get -yq install libsdl2-dev libsdl2-image-dev
          git clone https://github.com/Ponup/php-sdl.git "$RUNNER_TEMP/php-sdl"
          cd "$RUNNER_TEMP/php-sdl"
          git checkout "$SDL_REF"
          phpize
          ./configure
          make
          sudo make install
      - name: "Build SDL2_image extension"
        run: |
          phpize
          ./configure --with-sdl_image
          make
      - name: "Run the tests"
        uses: coactions/setup-xvfb@v1
        with:
          run: |
            php run-tests.php -d extension=sdl.so -d extension=`pwd`/modules/sdl_image.so  --offline --show-diff --set-timeout 120 -q
          working-directory: ./
          options: -screen 0 1200x1024x24
